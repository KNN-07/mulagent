name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: false
      - run: vp i --frozen-lockfile
      - run: vp run fmt:check
      - run: vp run lint
      - run: vp run typecheck
      - name: Research packages, server workflows and web client
        run: vp test run packages/research-core packages/research-agents packages/research-backends packages/research-report apps/server/src/research apps/web/src/research

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install './python/mulagent[dev]'
      - run: python -m pytest python/mulagent/tests
