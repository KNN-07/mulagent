[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mulagent"
version = "0.1.0"
description = "MulAgent experiment tracking SDK and job runner for autonomous ML research"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
mlflow = ["mlflow>=2.10"]
all = ["wandb>=0.16", "mlflow>=2.10"]
dev = ["pytest>=8.0"]

[project.scripts]
mulagent-job = "mulagent.job:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mulagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
